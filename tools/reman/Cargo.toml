# The repository's release manager: its projects (reman.toml files), their versions, change files and changelogs,
# releases, and the lints and tests of every workspace (README.md).

[workspace]
resolver = "3"
members = ["."]

[package]
name = "reman"
description = "Release manager of the repository: projects, versions, changelogs, releases, lints and tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"
repository = "https://github.com/ayecue/greybel-rs"
publish = false
autotests = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
cargo-lock = "11"
clap = { version = "4.6", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["status", "revision", "sha1", "parallel"] }
globset = "0.4"
gray_matter = "0.3"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2.39", features = ["serde"] }
jsonc-parser = { version = "0.34.0", features = ["cst"] }
octocrab = { version = "0.54", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1"
roxmltree = "0.21"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
similar = "2"
slug = "0.1"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "main"
path = "tests/main.rs"

# Keep local line tables, omitting other debug info and all dependency debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
