[package]
name = "greyhack-setup-wizard"
description = "Sets up Grey Hack for the message hook in a window or on the command line: BepInEx, the hook plugin and its port"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[[bin]]
name = "greyhack-setup"
path = "src/main.rs"

[features]
default = ["window"]
# Opens a window without arguments. Without it, the program is only the command line, as in the VS Code extension.
window = ["dep:eframe", "dep:rfd"]

[dependencies]
clap.workspace = true
eframe = { version = "0.37", optional = true }
greyhack-setup = { workspace = true, features = ["cli"] }
rfd = { version = "0.18", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["window"]

[lints]
workspace = true
