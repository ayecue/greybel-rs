[package]
name = "greyhack-world-server"
description = "Loopback TCP game server for sharing a Grey Hack world between runtime processes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[dependencies]
clap.workspace = true
greyhack-world-host.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
duplex-core.workspace = true
duplex-driver-stdio.workspace = true
duplex-test-support = { workspace = true, features = ["tokio"] }
greybel-runtime.workspace = true
greybel-test-support = { workspace = true, features = ["interpreter"] }
greyhack-world.workspace = true
greyscript-intrinsics.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
