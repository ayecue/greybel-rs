packages:
  - '*'

# Packages of the repository's other TypeScript workspaces, used from their
# folders: install those workspaces first.
overrides:
  emitter: link:../../common/ts/emitter
  handle-error: link:../../common/ts/handle-error
  presets: link:../../common/ts/presets

allowBuilds:
  '@playwright/browser-chromium': true
  '@vscode/vsce-sign': true
  core-js-pure: false
  esbuild: true
  keytar: false
