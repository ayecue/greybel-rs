[package]
name = "scheduler"
description = "Monotonic clocks, asynchronous sleeps, deferred callbacks, and timers for Tokio, browsers, and manual test runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[features]
# Tokio clock and timers; deferred callbacks on the current `LocalSet`.
tokio = ["dep:tokio"]
# Browser clock (`performance.now`), timers (`setTimeout`, `setInterval`), and event-loop callbacks.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
# Manually advanced clock for tests.
manual = []

[dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util"] }

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["tokio", "manual"]

[lints]
workspace = true
