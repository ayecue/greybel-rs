[workspace]
resolver = "3"
members = ["text-mesh-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"
repository = "https://github.com/ayecue/greybel-rs"

[workspace.dependencies]
text-mesh-ansi = { path = "text-mesh-ansi" }
text-mesh-canvas = { path = "text-mesh-canvas" }
text-mesh-core = { path = "text-mesh-core" }
text-mesh-font = { path = "text-mesh-font" }
text-mesh-font-builder = { path = "text-mesh-font-builder" }
text-mesh-html = { path = "text-mesh-html" }
text-mesh-layout = { path = "text-mesh-layout" }
text-mesh-setup = { path = "text-mesh-setup" }
text-mesh-test-support = { path = "text-mesh-test-support" }
text-mesh-unity = { path = "text-mesh-unity" }
text-mesh-webgl = { path = "text-mesh-webgl" }

base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skrifa = { version = "0.49", default-features = false, features = ["std"] }
thiserror = "2"
toml = "1"
ttf-parser = "0.25"
unicode-general-category = "1"

# Keep local line tables, omitting other debug info and all dependency debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Binaries choose their own panic behavior.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
