[project]
kind = "app"
# Named after its folder (its solution is GreyHackMessageHook).
tag = "greyhack-message-hook/v{version}"
# The setup wizard installs the plugin from the release of its own commit (greyhack-setup's MessageHook::VERSION),
# or with `--release latest` from the latest release.
latest = true

# The plugin against the installed game's assemblies (GREY_HACK_PATH).
[tasks.game]
suite = "game"
run = "dotnet test --solution GreyHackMessageHook.slnx"
