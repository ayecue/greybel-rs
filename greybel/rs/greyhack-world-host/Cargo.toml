[package]
name = "greyhack-world-host"
description = "Loopback TCP world server that the runtimes of one machine share, administered through the world-host protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
clap = { workspace = true, features = ["env"] }
duplex-core.workspace = true
duplex-driver-stdio.workspace = true
greyhack-world.workspace = true
greyhack-world-core.workspace = true
greyhack-world-operations.workspace = true
greyhack-world-programs.workspace = true
scheduler = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["std"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-std", "io-util", "sync", "time"] }

[lints]
workspace = true
