[package]
name = "greybel-mcp"
description = "MCP server for GreyScript and MiniScript API reference, diagnostics, builds, transformation, and simulated execution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
scheduler = { workspace = true, features = ["tokio"] }
greybel-api-reference.workspace = true
greybel-builder = { workspace = true, features = ["game"] }
greybel-core.workspace = true
greybel-documents.workspace = true
greybel-documents-fs-provider.workspace = true
greybel-io.workspace = true
greybel-project = { workspace = true, features = ["builder", "runtime"] }
greybel-runtime = { workspace = true, features = ["game"] }
greybel-type-analyzer.workspace = true
greyhack-terminal-text.workspace = true
greybel-runtime-world.workspace = true
greyscript-intrinsics.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "macros"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
