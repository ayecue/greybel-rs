[package]
name = "greyhack-world"
description = "Seed-generated, SQLite-persisted Grey Hack world independent of the interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
duplex-core.workspace = true
indexmap.workspace = true
greyhack-behaviour.workspace = true
greyhack-world-core.workspace = true
greyhack-world-creation.workspace = true
greyhack-world-economy.workspace = true
greyhack-world-guilds.workspace = true
greyhack-world-intrusion.workspace = true
greyhack-world-libraries.workspace = true
greyhack-world-missions.workspace = true
greyhack-world-modules.workspace = true
greyhack-world-npcs.workspace = true
greyhack-world-player.workspace = true
greyhack-world-router.workspace = true
greyhack-world-services.workspace = true
greyhack-world-shell.workspace = true
greyhack-world-smart-devices.workspace = true
greyhack-world-assets.workspace = true
greyhack-world-routines.workspace = true
greyhack-world-storage.workspace = true
mono-random.workspace = true
serde.workspace = true
serde_json.workspace = true
greybel-source-map = { workspace = true, features = ["serde"] }
thiserror.workspace = true
turso.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
greybel-test-support = { workspace = true, features = ["world"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "web"
path = "tests/web.rs"
