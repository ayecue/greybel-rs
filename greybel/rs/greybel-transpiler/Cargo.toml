[package]
name = "greybel-transpiler"
description = "Transpiler/bundler for MiniScript/Greybel"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
rustc-hash.workspace = true
greybel-core.workspace = true
greybel-symbols.workspace = true
greybel-documents.workspace = true
greybel-source-map.workspace = true
thiserror.workspace = true

[dev-dependencies]
greybel-documents-fs-provider.workspace = true
greybel-documents-memory-provider.workspace = true
greybel-test-support = { workspace = true, features = ["documents", "node-depth"] }
serde_json.workspace = true
insta.workspace = true
criterion.workspace = true

[[bench]]
name = "transpile"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
