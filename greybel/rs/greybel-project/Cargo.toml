[package]
name = "greybel-project"
description = "A GreyScript project's greybel.json: its settings with their defaults, where it is found, its JSON Schema, and the builds and runs it describes"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
greybel-builder = { workspace = true, optional = true }
greybel-bundler.workspace = true
greybel-core.workspace = true
greybel-documents.workspace = true
greybel-runtime = { workspace = true, optional = true }
greybel-type-analyzer.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Builds and imports as greybel-builder's protocol describes them.
builder = ["dep:greybel-builder"]
# Runs as greybel-runtime's protocol describes them.
runtime = ["dep:greybel-runtime"]

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
