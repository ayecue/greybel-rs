[package]
name = "greybel-lsp-web"
description = "Browser-worker greybel-lsp server providing JSON-RPC language server messages over a host-provided port"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
duplex-core.workspace = true
duplex-driver-web.workspace = true
greybel-lsp.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
duplex-ts.workspace = true
greybel-test-support.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
