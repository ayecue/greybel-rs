# The game tests (greyhack-message-hook-client's feature `game`) each run the game itself: one at a time, as their
# harness (greybel-test-support's `game`) runs one game at a time anyway.
[test-groups]
game = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(greyhack-message-hook-client) and test(/^game::/)'
test-group = 'game'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'package(greybel-runtime) and test(/^game::/)'
test-group = 'game'
slow-timeout = { period = "60s", terminate-after = 4 }

# Build 26 missions of every kind, generate eleven missions' networks, or copy the player's whole network, in the game
# and in Greybel: 30–180 s on an idle machine.
[[profile.default.overrides]]
filter = 'package(greyhack-test-support-client) and (test(=parity_missions::should_give_the_mission_networks_the_files_the_game_does) | test(=parity_missions::should_build_the_missions_the_game_builds) | test(=parity_network::should_match_intrinsics_for_the_players_network))'
test-group = 'game'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(greyhack-test-support-client) and test(/^(game|parity_[a-z_]+)::/)'
test-group = 'game'
slow-timeout = { period = "60s", terminate-after = 4 }
