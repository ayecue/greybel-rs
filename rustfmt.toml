# The Rust style guide's layout, rustfmt's defaults, for every Cargo workspace of the repository (rustfmt reads the
# nearest rustfmt.toml above a file), plus std / external / crate import groups with one `use` per module.
style_edition = "2024"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true

# Nightly-only options: `cargo +nightly fmt` applies them (stable rustfmt warns that it skips them).
group_imports = "StdExternalCrate"
imports_granularity = "Module"
format_code_in_doc_comments = true
# Associated types and constants first in each impl, then macros and methods.
reorder_impl_items = true
