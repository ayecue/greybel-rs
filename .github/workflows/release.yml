# Releases the apps a prepared release names (`cargo reman release prepare`, committed and pushed to main): reman
# tags them and creates draft releases, the jobs below build and attach their files, greybel-vs goes to the
# marketplaces, and the drafts are published once everything succeeded. Creating the tags and drafts, publishing the
# drafts, and publishing to the marketplaces wait for approval (environments `github-release` and `marketplaces`).
# A failed run can be re-run: publish lists the apps tagged at the commit again.
name: Release

on:
  push:
    branches: [main]
    paths: [.changes/release.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  GH_TOKEN: ${{ github.token }}
  SPACES_BUCKET: greybel-assets
  SPACES_ENDPOINT: https://fra1.digitaloceanspaces.com

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: github-release
    outputs:
      publications: ${{ steps.publish.outputs.publications }}
      vs: ${{ steps.publish.outputs.vs }}
      vs-version: ${{ steps.publish.outputs.vs-version }}
      cli: ${{ steps.publish.outputs.cli }}
      cli-version: ${{ steps.publish.outputs.cli-version }}
      lsp: ${{ steps.publish.outputs.lsp }}
      lsp-version: ${{ steps.publish.outputs.lsp-version }}
      wizard: ${{ steps.publish.outputs.wizard }}
      wizard-version: ${{ steps.publish.outputs.wizard-version }}
      hook: ${{ steps.publish.outputs.hook }}
      hook-version: ${{ steps.publish.outputs.hook-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Tags and draft releases
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Outside the working tree: publish refuses to tag with uncommitted or untracked files.
          cargo reman release publish --draft > "$RUNNER_TEMP/publications.json"
          jq . "$RUNNER_TEMP/publications.json"
          echo "publications=$(jq -c . "$RUNNER_TEMP/publications.json")" >> "$GITHUB_OUTPUT"
          for pair in vs=ts/greybel-vs cli=rs/greybel-cli lsp=rs/greybel-lsp-stdio \
            wizard=rs/greyhack-setup-wizard hook=dotnet/GreyHackMessageHook; do
            key=${pair%%=*}
            id=${pair#*=}
            echo "$key=$(jq -r --arg id "$id" '.[] | select(.id == $id) | .tag' "$RUNNER_TEMP/publications.json")" >> "$GITHUB_OUTPUT"
            echo "$key-version=$(jq -r --arg id "$id" '.[] | select(.id == $id) | .version' "$RUNNER_TEMP/publications.json")" >> "$GITHUB_OUTPUT"
          done

  # greybel-cli, greybel-lsp, greyhack-setup-wizard and the programs greybel-vs runs, for every native VS Code
  # platform.
  native:
    needs: publish
    if: >-
      needs.publish.outputs.vs != '' || needs.publish.outputs.cli != '' || needs.publish.outputs.lsp != ''
      || needs.publish.outputs.wizard != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux through cargo-zigbuild: glibc 2.28, VS Code's minimum, or musl for Alpine. No 32-bit linux-armhf:
          # turso 0.8.3's turso_sync_engine doesn't compile there: it passes i64 offsets where 32-bit Linux's off_t is i32.
          - { platform: linux-x64, target: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.28, runner: ubuntu-24.04 }
          - { platform: linux-arm64, target: aarch64-unknown-linux-gnu, zig: aarch64-unknown-linux-gnu.2.28, runner: ubuntu-24.04 }
          - { platform: alpine-x64, target: x86_64-unknown-linux-musl, zig: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { platform: alpine-arm64, target: aarch64-unknown-linux-musl, zig: aarch64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { platform: win32-x64, target: x86_64-pc-windows-msvc, runner: windows-2025, exe: .exe }
          - { platform: win32-arm64, target: aarch64-pc-windows-msvc, runner: windows-2025, exe: .exe }
          - { platform: darwin-x64, target: x86_64-apple-darwin, runner: macos-15 }
          - { platform: darwin-arm64, target: aarch64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          reman: 'false'
          rust-targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        working-directory: apps/rs
        run: |
          build() {
            if [ -n "${{ matrix.zig }}" ]; then
              cargo zigbuild --release --locked --target "${{ matrix.zig }}" "$@"
            else
              cargo build --release --locked --target "${{ matrix.target }}" "$@"
            fi
          }
          release="../../target/${{ matrix.target }}/release"
          mkdir -p ../../out/bin ../../out/setup
          build -p greybel-cli -p greybel-lsp-stdio -p greybel-runtime-stdio -p greyhack-world-server -p greybel-builder-stdio
          for program in greybel greybel-lsp greybel-runtime greyhack-world-server greybel-builder; do
            cp "$release/${program}${{ matrix.exe }}" ../../out/bin/
          done
          # greyhack-setup without its window for the VS Code extension; built alone, since --no-default-features
          # applies to every package named.
          build -p greyhack-setup-wizard --no-default-features
          cp "$release/greyhack-setup${{ matrix.exe }}" ../../out/bin/
          # Window build for the greyhack-setup-wizard release; musl builds omit the window, since static binaries
          # can't load its system libraries.
          if [ -n "${{ needs.publish.outputs.wizard }}" ] && [ "${{ !endsWith(matrix.target, '-musl') }}" = true ]; then
            build -p greyhack-setup-wizard
          fi
          cp "$release/greyhack-setup${{ matrix.exe }}" ../../out/setup/
      - if: needs.publish.outputs.vs != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: out/bin
          retention-days: 7
      - name: Attach greybel and greybel-lsp
        run: |
          pack() {
            local tag=$1 version=$2 program=$3
            [ -n "$tag" ] || return 0
            local name="$program-$version-${{ matrix.target }}"
            mkdir -p "out/pack/$name"
            cp "out/bin/${program}${{ matrix.exe }}" LICENSE "out/pack/$name/"
            if [ -n "${{ matrix.exe }}" ]; then
              (cd out/pack && 7z a -tzip -bso0 "../$name.zip" "$name")
              gh release upload "$tag" "out/$name.zip" --clobber
            else
              tar -czf "out/$name.tar.gz" -C out/pack "$name"
              gh release upload "$tag" "out/$name.tar.gz" --clobber
            fi
          }
          pack "${{ needs.publish.outputs.cli }}" "${{ needs.publish.outputs.cli-version }}" greybel
          pack "${{ needs.publish.outputs.lsp }}" "${{ needs.publish.outputs.lsp-version }}" greybel-lsp
      - name: Attach greyhack-setup-wizard
        if: needs.publish.outputs.wizard != ''
        run: |
          archive=$(bash .github/scripts/package-setup-wizard.sh "${{ needs.publish.outputs.wizard-version }}" \
            "${{ matrix.target }}" "out/setup/greyhack-setup${{ matrix.exe }}" out/wizard)
          gh release upload "${{ needs.publish.outputs.wizard }}" out/wizard/* --clobber
          echo "attached $archive"

  vscode:
    needs: [publish, native]
    if: needs.publish.outputs.vs != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          wasm: 'true'
          node: 'true'
      - name: Build every workspace's packages
        run: cargo reman run build --language typescript
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: out/native
      - name: Package the web extension and one per native platform
        working-directory: apps/ts/greybel-vs
        run: |
          platforms=()
          for folder in ../../../out/native/native-*; do
            platform=${folder##*/native-}
            mv "$folder" "../../../out/native/$platform"
            platforms+=("$platform")
          done
          node scripts/package.cjs web "${platforms[@]}" --binaries ../../../out/native
          ls -l ./*.vsix
      - name: Attach the extension files
        working-directory: apps/ts/greybel-vs
        run: gh release upload "${{ needs.publish.outputs.vs }}" ./*.vsix --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apps/ts/greybel-vs/*.vsix
          retention-days: 7

  # The VSIX files vscode packaged, to the Visual Studio Marketplace and Open VSX, once approved.
  marketplaces:
    needs: [publish, vscode]
    if: needs.publish.outputs.vs != ''
    runs-on: ubuntu-24.04
    environment: marketplaces
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # vsce and ovsx at greybel-vs's locked versions.
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: out/vsix
      - name: Publish to the Visual Studio Marketplace
        working-directory: apps/ts/greybel-vs
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --skip-duplicate --packagePath ../../../out/vsix/*.vsix
      - name: Publish to Open VSX
        working-directory: apps/ts/greybel-vs
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for file in ../../../out/vsix/*.vsix; do
            pnpm exec ovsx publish "$file" --skip-duplicate
          done

  hook:
    needs: publish
    if: needs.publish.outputs.hook != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Grey Hack's assembly the plugin compiles against, encrypted with the secret GREY_HACK_ASSEMBLY_KEY, on Spaces
      # (never in the repository): .github/scripts/upload-message-hook-assembly.sh uploads it.
      - name: Grey Hack's Assembly-CSharp.dll
        env:
          GREY_HACK_ASSEMBLY_KEY: ${{ secrets.GREY_HACK_ASSEMBLY_KEY }}
        run: |
          echo "GREY_HACK_MANAGED_PATH=$RUNNER_TEMP/managed" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/managed"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/message-hook-assembly.enc" \
            https://greybel-assets.fra1.digitaloceanspaces.com/ci/message-hook-assembly.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:GREY_HACK_ASSEMBLY_KEY \
            -in "$RUNNER_TEMP/message-hook-assembly.enc" -out "$RUNNER_TEMP/managed/Assembly-CSharp.dll"
      - name: Build for BepInEx 5 and 6
        working-directory: greybel/dotnet/greyhack-message-hook
        run: |
          dotnet build src -c Release-BepInEx5
          dotnet build src -c Release-BepInEx6
      - name: Attach
        working-directory: greybel/dotnet/greyhack-message-hook/src/bin
        run: >-
          gh release upload "${{ needs.publish.outputs.hook }}" --clobber
          Release-BepInEx5/BepInEx5/netstandard2.1/GreyHackMessageHook5.dll
          Release-BepInEx6/BepInEx6/netstandard2.1/GreyHackMessageHook.dll

  # Generate SHA256SUMS for every release. After approval, publish the drafts, mark the latest app release,
  # and upload greybel releases to Spaces for `greybel update`.
  finish:
    needs: [publish, native, vscode, hook]
    if: >-
      !cancelled() && needs.publish.result == 'success' && !contains(needs.*.result, 'failure')
      && needs.publish.outputs.publications != '[]'
    runs-on: ubuntu-24.04
    environment: github-release
    steps:
      - uses: actions/checkout@v4
      - name: Checksums and publication
        env:
          PUBLICATIONS: ${{ needs.publish.outputs.publications }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          jq -c '.[]' <<< "$PUBLICATIONS" | while read -r app; do
            tag=$(jq -r .tag <<< "$app")
            latest=$(jq -r .latest <<< "$app")
            folder=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$folder" --pattern '*' || true
            rm -f "$folder/SHA256SUMS"
            if [ -n "$(ls -A "$folder")" ]; then
              (cd "$folder" && sha256sum -- * > SHA256SUMS)
              gh release upload "$tag" "$folder/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
            echo "published $tag (latest: $latest)"
            if [ "$(jq -r .id <<< "$app")" = rs/greybel-cli ]; then
              bash .github/scripts/upload-cli-release.sh "$(jq -r .version <<< "$app")" "$tag" "$folder"
            fi
          done
